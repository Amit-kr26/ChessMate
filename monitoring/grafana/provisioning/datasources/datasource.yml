apiVersion: 1
datasources:
  - name: ChessMate Postgres
    type: grafana-postgresql-datasource
    uid: aeo2c8b4jnrwgc
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
